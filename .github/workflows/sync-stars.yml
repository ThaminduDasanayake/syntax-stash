name: Sync GitHub Stars

on:
  schedule:
    # Runs every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stars:
    name: Sync GitHub Star Counts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Fetch and Sync Star Counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:stars

      - name: Commit and Push Changes
        run: |
          if ! git diff --quiet lib/resource-data/github-stars.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/resource-data/github-stars.json
            git commit -m "chore(data): update github stars [skip ci]"
            git push
            echo "✅ GitHub stars updated and pushed."
          else
            echo "✅ No star count changes detected."
          fi
